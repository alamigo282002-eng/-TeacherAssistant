name: helper
description: "مُساعِد المُعلِّم - Teacher Assistant App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Unique IDs
  uuid: ^4.5.1

  # Date & Localization
  intl: ^0.20.2

  # URL Launcher (phone calls, WhatsApp)
  url_launcher: ^6.3.1

  # PDF
  pdf: ^3.11.3
  printing: ^5.13.3

  # Notifications & Background Tasks
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^8.17.0
  timezone: ^0.11.1

  file_picker: ^11.0.3

  # Share
  share_plus: ^12.0.2

  # Shared Preferences (settings)
  shared_preferences: ^2.3.5

  # Fonts
  google_fonts: ^8.2.1

  # Charts
  fl_chart: ^1.2.0

  # Slidable list items
  flutter_slidable: ^4.0.3

  # Animations
  lottie: 3.3.0
  flutter_animate: ^4.5.0

  # Permissions & Native
  permission_handler: ^13.0.1
  flutter_contacts: ^1.1.9

  # QR Code Generator
  qr_flutter: ^4.1.0

  # Local Auth
  local_auth: ^2.2.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#0E3A3A"
  adaptive_icon_foreground: "assets/app_icon.jpg"
